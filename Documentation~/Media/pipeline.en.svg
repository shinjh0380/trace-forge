<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="436" viewBox="0 0 1280 436" role="img" aria-labelledby="title"><title id="title">TraceForge log routing schematic</title><rect width="1280" height="436" rx="24" fill="#0b1118"/><text x="42" y="58" fill="#edf3fa" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="29" font-weight="600" text-anchor="start">ONE API. TWO BUILT-IN DESTINATIONS.</text><rect x="42" y="118" width="250" height="164" rx="18" fill="#121d29" stroke="#263749"/><text x="66" y="158" fill="#8bd5ed" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="600" text-anchor="start">TF</text><text x="66" y="194" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="start">6 levels / 9 categories</text><text x="66" y="231" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">Unity capture (optional)</text><rect x="354" y="118" width="240" height="164" rx="18" fill="#121d29" stroke="#263749"/><text x="378" y="158" fill="#8bd5ed" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="600" text-anchor="start">Logger</text><text x="378" y="194" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="20" font-weight="400" text-anchor="start">Category + verbosity</text><text x="378" y="231" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="15" font-weight="400" text-anchor="start">Same-thread recursion guard</text><rect x="682" y="102" width="542" height="100" rx="18" fill="#121d29" stroke="#263749"/><text x="706" y="142" fill="#8bd5ed" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="600" text-anchor="start">RingBufferSink</text><text x="706" y="178" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="start">1,024 entries → Editor Log Viewer</text><rect x="682" y="238" width="542" height="138" rx="18" fill="#121d29" stroke="#263749"/><text x="706" y="278" fill="#ffb783" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="31" font-weight="600" text-anchor="start">FileSink</text><text x="706" y="314" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="23" font-weight="400" text-anchor="start">4,096 queue → worker → file</text><text x="706" y="351" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="400" text-anchor="start">Opt-in / producer waits when queue is full</text><path d="M292 200 H342" fill="none" stroke="#8bd5ed" stroke-width="3" /><path d="M332 193 L342 200 L332 207" fill="none" stroke="#8bd5ed" stroke-width="3" /><path d="M594 200 H638 V152 H670 M638 200 V302 H670" fill="none" stroke="#8bd5ed" stroke-width="3" /><path d="M660 145 L670 152 L660 159 M660 295 L670 302 L660 309" fill="none" stroke="#8bd5ed" stroke-width="3" /><text x="42" y="370" fill="#c5e7a4" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="18" font-weight="600" text-anchor="start">DEFAULTS: EDITOR / DEVELOPMENT</text><text x="42" y="402" fill="#a9b9cc" font-family="Segoe UI, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="19" font-weight="400" text-anchor="start">Release Players require an enabled sink.</text></svg>
